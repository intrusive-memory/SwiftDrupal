name: Tests

on:
  pull_request:
    branches: [main, development]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-macos:
    name: Test on macOS
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme SwiftDrupal \
            -destination 'platform=macOS'

      - name: Build
        run: |
          xcodebuild build \
            -scheme SwiftDrupal \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          set +e
          xcodebuild test \
            -scheme SwiftDrupal \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test_output.txt
          TEST_EXIT_CODE=${PIPESTATUS[0]}

          if grep -q "TEST SUCCEEDED" test_output.txt; then
            echo "All unit tests passed"
            exit 0
          else
            echo ""
            echo "============================================"
            echo "UNIT TESTS FAILED"
            echo "============================================"
            echo ""
            echo "Failed Tests:"
            grep "Test Case.*failed" test_output.txt || echo "  No specific test failures found"
            echo ""
            echo "Error Messages:"
            grep -E "error:|failed with|Assertion failed|Fatal error" test_output.txt | head -20 || echo "  No error messages found"
            echo ""
            exit "${TEST_EXIT_CODE:-1}"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test_output.txt
          retention-days: 7
